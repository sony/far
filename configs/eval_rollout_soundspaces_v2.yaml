# SoundSpaces v2: the paper's rollout evaluation (arms + protocol). Inherits every shared
# knob from eval_rollout.yaml; select it with `--config-name eval_rollout_soundspaces_v2` (the
# bash_scripts/<corpus>/eval_rollout_sharded.sh launchers do).
defaults:
  - eval_rollout
  - _self_

arms:
  ssv2_temporal:
    run_dir: models/soundspaces_v2/temporal
    ckpt: "0700000"
  ssv2_worldmem:
    run_dir: models/soundspaces_v2/worldmem
    ckpt: "0700000"
  ssv2_pnp_meta:
    run_dir: models/soundspaces_v2/far_meta
    ckpt: "0700000"
  ssv2_pnp_amz:
    run_dir: models/soundspaces_v2/far_multicue
    ckpt: "0700000"

dataset: soundspaces_v2_latent
output_dir: results/rollout_eval/ssv2_0700000_stride16_context12
rollout_stride: 16
