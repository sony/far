# SoundSpaces V2 — periodic 360-degree scans: scan_A + scan_mid_K legs fire on
# region changes along the outbound, closing the observability gaps v1's
# endpoint-only scans left (missing scan_B, unseen mid-path surfaces). Same
# episode format / conventions as soundspaces_latent; only the corpus differs.
# SoundSpaces audio-visual loopnav episodes, pre-computed SDXL-VAE latents
# (scripts/data/build_latent_dataset_soundspaces.py). Pair with
# `model/tokenizer=sdxl_vae` (latents are saved at its 0.13025 scale) and
# 256x256 image_height/width. fps = 10 (vs loopnav's 20): time-denominated
# constants are HALVED in frames — max_frame_offset 10 keeps the stride
# normalization at a 1 s horizon (stride_to_seconds = 10/10 = 1.0, same as
# loopnav), and len_traj_pred should be set accordingly at launch.
spec:
  _target_: far.builders.data.build_dataspec
  # Identity-range stats — the same convention loopnav_latent trains with
  # (goal displacements enter normalize_data as 2x-1; worldmem/posefa invert
  # exactly via these stats).
  local_pos_stats:
    min: [0, 0, 0]
    max: [1, 1, 1]
  meters_per_waypoint: 1.0
  max_frame_offset: 10.0
  len_traj_pred: ${len_traj_pred}
  planner_mu_init: [-0.1, 0, 0, 0, 0]
  planner_sigma_init: [0.02, 0.1, 0, 0, 0.3142]
  pose_fields: ["x", "y", "z", "pitch", "yaw"]
  pose_dim: 5
  pos_dim: 3
  angle_dim: 2
  pose_mode: "3d"
  fps: 10.0

shared:
  manifest_path: results/manifests/soundspaces_v2/soundspaces_v2_latent.json
  backend:
    _target_: far.data.backends.SoundSpacesBackend
    # Pre-computed retriever-key sidecar inside each episode dir
    # (latents<key_suffix>, e.g. ".keys_audio.npy" once the audio encoder
    # lands). null -> no cached keys (phase A: no learned retrieval yet).
    # Poses are ALWAYS standardized to the z-up frame (the Habitat convention
    # matches raw LoopNav; verified +0.9996 walking-motion alignment) — no
    # standard_frame knob.
    key_suffix: null
    # Per-frame AUDIO WINDOW mode — (T, 4, n_mels, audio_window_hops) causal
    # windows from audio_feat.npy (normalized, head-padded):
    #   null     — no audio (latents only; the default world-model path);
    #   "frames" — windows REPLACE latents in the frames slot (contrastive
    #              pretrain: QueryViT live-encodes the pool as 4-ch images);
    #   "cue"    — frames stay latents AND the windows ride along as a "cues"
    #              item; the formatter forwards the current frame's window as
    #              `query_cue` (pnp_cl query_source="cue"; pool side comes
    #              from cached keys via key_suffix).
    # 48 hops = 0.48 s (divisible by QueryViT patch_size 4).
    audio_mode: null
    audio_window_hops: 48
  transform: null

sampler:
  random_clip:
    _target_: far.data.samplers.RandomClipSampler
    clip_len: 16
    frame_stride: 5
  context_goal:
    _target_: far.data.samplers.ContextGoalSampler
    context_pool_size: 200 # 20 s of context pool at fps 10
    len_traj_pred: ${len_traj_pred}
    goals_per_obs: ${goals_per_obs}
  context_goal_test:
    _target_: far.data.samplers.ContextGoalSampler
    context_pool_size: 200
    len_traj_pred: ${len_traj_pred}
    goals_per_obs: 4
  context_traj:
    _target_: far.data.samplers.ContextTrajectorySampler
    context_pool_size: 200
    len_traj_pred: ${len_traj_pred}

formatter:
  frame:
    _target_: far.data.formatters.FrameFormatter
  context_pose:
    _target_: far.data.formatters.ContextPoseFormatter
    spec: ${soundspaces_v2_latent.spec}

train:
  _target_: far.data.datasets.FormattedVideoDataset
  formatter: ${soundspaces_v2_latent.formatter.context_pose}
  base_dataset:
    _target_: far.data.datasets.VideoDataset
    manifest_path: ${soundspaces_v2_latent.shared.manifest_path}
    index_path: results/indices/soundspaces_v2/soundspaces_v2_latent_train.json
    backend: ${soundspaces_v2_latent.shared.backend}
    sampler: ${soundspaces_v2_latent.sampler.context_goal}
    transform: ${soundspaces_v2_latent.shared.transform}

test:
  _target_: far.data.datasets.FormattedVideoDataset
  formatter: ${soundspaces_v2_latent.formatter.context_pose}
  base_dataset:
    _target_: far.data.datasets.VideoDataset
    manifest_path: ${soundspaces_v2_latent.shared.manifest_path}
    index_path: results/indices/soundspaces_v2/soundspaces_v2_latent_test.json
    backend: ${soundspaces_v2_latent.shared.backend}
    sampler: ${soundspaces_v2_latent.sampler.context_goal_test}
    transform: ${soundspaces_v2_latent.shared.transform}
