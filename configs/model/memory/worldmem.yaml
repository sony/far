_target_: far.memories.worldmem.WorldMemRetrieval

num_samples: 10000     # points sampled inside the visibility sphere
radius: 30.0           # sphere radius around the goal camera position (world units)
fov_half_h: 52.5       # horizontal half-FOV in degrees (52.5 → 105° total)
fov_half_v: 37.5       # vertical   half-FOV in degrees (37.5 →  75° total)
recency_factor: 0.2    # maximum temporal penalty applied to the oldest frame
# Inverse-normalisation stats used to recover the goal pose (in `context_poses`
# units) from `action` (= the formatter's `goal_poses_nl`). For proper goal-pose
# retrieval, override at the command line with the active dataset's spec, e.g.:
#     model.memory.local_pos_stats=${loopnav_latent.spec.local_pos_stats}
# Default null = identity transform (action treated as already in
# `context_poses` units, e.g. demos passing zero actions or pre-unnormalised ones).
local_pos_stats: null
