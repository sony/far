[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "far"
version = "0.1.0"
description = "FAR: a latent-diffusion world model with a learned retrieval memory"
requires-python = ">=3.11"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
    {name = "Beomsu Kim"}
]
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torcheval>=0.0.7",
    "numpy>=2.0",
    "scipy>=1.12",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tqdm>=4.0",
    "timm>=1.0",
    "lpips>=0.1.4",
    "dreamsim>=0.2.1",
    "diffusers>=0.37.0",
    "evo>=1.35.0",
    "hydra-core>=1.3.0",
    "h5py>=3.0",
    "matplotlib>=3.0",
    "einops>=0.7.0",
    "av>=12.0",
    "wandb>=0.18.0",
    "webdataset>=0.2.0",
    "ipython>=8.0",
    "huggingface_hub>=0.30",
]
